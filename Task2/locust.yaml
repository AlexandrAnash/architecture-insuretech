apiVersion: apps/v1
kind: Deployment
metadata:
  name: locust
  namespace: scaletest
  labels:
    app: locust
spec:
  replicas: 1
  selector:
    matchLabels:
      app: locust
  template:
    metadata:
      labels:
        app: locust
    spec:
      containers:
        - name: locust
          image: locustio/locust:latest
          args:
            - "-f"
            - "/mnt/locust/locustfile.py"
            - "-H"
            - "http://scaletestapp:8080"
          ports:
            - name: web
              containerPort: 8089
          volumeMounts:
            - name: locustfile
              mountPath: /mnt/locust
      volumes:
        - name: locustfile
          configMap:
            name: locustfile